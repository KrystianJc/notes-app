---
- name: Basic RHEL server setup
  hosts: servers
  become: true
  tasks:
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Install basic tools
      ansible.builtin.dnf:
        name:
          - vim-enhanced
          - git
          - bash-completion
        state: present

    - name: Make sure firewalld is running and starts on boot
      ansible.builtin.systemd_service:
        name: firewalld
        state: started
        enabled: true

    - name: Make sure SELinux is in enforcing mode
      ansible.posix.selinux:
        policy: targeted
        state: enforcing

    - name: Allow k3s pod network through the firewall
      ansible.posix.firewalld:
        source: "{{ k3s_cluster_cidr }}"
        zone: trusted
        state: enabled
        permanent: true
        immediate: true

    - name: Allow k3s service network through the firewall
      ansible.posix.firewalld:
        source: "{{ k3s_service_cidr }}"
        zone: trusted
        state: enabled
        permanent: true
        immediate: true

    - name: Allow Kubernetes API port through the firewall
      ansible.posix.firewalld:
        port: 6443/tcp
        zone: public
        state: enabled
        permanent: true
        immediate: true

    - name: Add k3s RPM repository
      ansible.builtin.yum_repository:
        name: rancher-k3s-common
        description: Rancher K3s Common
        baseurl: https://rpm.rancher.io/k3s/stable/common/centos/9/noarch
        gpgcheck: true
        gpgkey: https://rpm.rancher.io/public.key
        enabled: true

    - name: Mark k3s repo as added
      ansible.builtin.set_fact:
        k3s_repo_added: true

    - name: Install k3s SELinux policy package
      ansible.builtin.dnf:
        name: k3s-selinux
        state: present
      when: k3s_repo_added | default(false)

    - name: Create k3s config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write k3s config with TLS SAN
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        content: |
          tls-san:
            - {{ k3s_api_address }}
      register: k3s_config

    - name: Download k3s installer script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/bin/k3s-install.sh
        mode: "0755"

    - name: Install k3s server
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-install.sh
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_SKIP_SELINUX_RPM: "true"
        INSTALL_K3S_SKIP_START: "true"

    - name: Restore SELinux context on k3s binary
      ansible.builtin.command:
        cmd: restorecon -v /usr/local/bin/k3s
      register: restorecon_result
      changed_when: "'Relabeled' in restorecon_result.stdout"

    - name: Make sure k3s service is running and enabled
      ansible.builtin.systemd_service:
        name: k3s
        state: started
        enabled: true

    - name: Remove old k3s server certificates (force regeneration)
      ansible.builtin.file:
        path: "/var/lib/rancher/k3s/server/tls/{{ item }}"
        state: absent
      loop:
        - serving-kube-apiserver.crt
        - serving-kube-apiserver.key
      when: k3s_config.changed

    - name: Restart k3s now if config changed
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
      when: k3s_config.changed
